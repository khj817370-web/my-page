
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#faf8ef">
<title>2048 AI 进化版</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#eee9df;color:#776e65;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#app{width:100%;max-width:420px;margin:0 auto;background:#faf8ef;padding:16px;border-radius:14px;box-shadow:0 3px 16px #0002}
h2{font-size:22px;margin:0 0 12px}
.info{display:flex;gap:8px;margin:10px 0}
.info div{flex:1;background:#eee4da;padding:9px 5px;text-align:center;border-radius:6px;font-weight:600;font-size:14px}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:8px;background:#bbada0;border-radius:8px;touch-action:manipulation}
.cell{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:clamp(17px,5vw,27px);font-weight:800;overflow:hidden}
#status{min-height:38px;padding:10px 2px;font-size:13px;line-height:1.5}
#stats{white-space:pre-line;line-height:1.8;background:#eee4da;padding:10px;border-radius:7px;font-size:13px;margin-bottom:12px}
.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button{min-height:42px;border:0;border-radius:7px;background:#8f7a66;color:white;font-size:14px;font-weight:600;padding:9px 4px;cursor:pointer;touch-action:manipulation}
button:active{opacity:.75}
#hint{font-size:11px;line-height:1.6;margin-top:12px;color:#8b8178}
@media(min-width:600px){body{padding:24px}#app{padding:20px}}
</style>
</head>
<body>
<main id="app">
<h2>🧠 2048 AI 进化版</h2>
<div class="info">
  <div id="score">得分：0</div>
  <div id="max">最大方块：0</div>
</div>
<div id="board"></div>
<div id="status">准备开始</div>
<div id="stats"></div>
<div class="buttons">
  <button id="step">走一步</button>
  <button id="auto">自动运行</button>
  <button id="train">连续训练：关</button>
  <button id="reset">新的一局</button>
  <button id="clear">清除学习</button>
  <button id="close">重置界面</button>
</div>
<div id="hint">Expectimax 搜索 · 跨局参数进化<br>学习记录保存在当前网页的浏览器存储中。</div>
</main>

<script>
"use strict";

(() => {
const SIZE=4;
const DIRS=["上","右","下","左"];
const KEY="2048-ai-evolution-html-v1";

const BASE={
  empty:270,smooth:18,mono:3,merge:45,
  max:30,snake:60,corner:100
};

const SNAKE=[15,14,13,12,8,9,10,11,7,6,5,4,0,1,2,3];

function defaultData(){
  return {
    stats:{games:0,wins:0,bestTile:0,bestScore:0,bestFitness:-1},
    bestWeights:null
  };
}

function loadData(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x&&x.stats){
      const d=defaultData();
      d.stats={...d.stats,...x.stats};
      d.bestWeights=x.bestWeights||null;
      if(!Number.isFinite(d.stats.bestFitness))
        d.stats.bestFitness=-1;
      return d;
    }
  }catch(e){}
  return defaultData();
}

let data=loadData();
let weights={...BASE,...(data.bestWeights||{})};
let board=[];
let score=0;
let moves=0;
let ended=false;
let auto=false;
let continuous=false;
let timer=null;
let generationTimer=null;

const $=id=>document.getElementById(id);

function status(s){$("status").textContent=s;}

function saveData(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(e){
    console.warn("学习数据保存失败",e);
    status("无法保存记录，请检查浏览器存储权限");
  }
}

function spawn(b){
  const empty=[];
  for(let i=0;i<16;i++)if(!b[i])empty.push(i);
  if(!empty.length)return;
  const i=empty[Math.floor(Math.random()*empty.length)];
  b[i]=Math.random()<0.9?2:4;
}

function newBoard(){
  const b=Array(16).fill(0);
  spawn(b);
  spawn(b);
  return b;
}

function slideLine(line){
  const a=line.filter(Boolean);
  let gain=0;
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){
      a[i]*=2;
      gain+=a[i];
      a.splice(i+1,1);
    }
  }
  while(a.length<4)a.push(0);
  return {line:a,gain};
}

function move(b,dir){
  const out=Array(16).fill(0);
  let gain=0;

  for(let k=0;k<4;k++){
    const ids=Array.from({length:4},(_,j)=>{
      if(dir===0)return j*4+k;
      if(dir===1)return k*4+3-j;
      if(dir===2)return (3-j)*4+k;
      return k*4+j;
    });

    const result=slideLine(ids.map(i=>b[i]));
    gain+=result.gain;
    ids.forEach((id,j)=>out[id]=result.line[j]);
  }

  return {
    board:out,
    gain,
    changed:out.some((v,i)=>v!==b[i])
  };
}

function evaluate(b,w){
  let empty=0,smooth=0,merges=0,snake=0;
  const logs=b.map(v=>v?Math.log2(v):0);
  const max=Math.max(...b);
  const maxPos=b.indexOf(max);

  for(let i=0;i<16;i++){
    if(!b[i]){
      empty++;
      continue;
    }
    const r=i>>2,c=i&3;
    if(c<3&&b[i+1]){
      smooth+=Math.abs(logs[i]-logs[i+1]);
      if(b[i]===b[i+1])merges++;
    }
    if(r<3&&b[i+4]){
      smooth+=Math.abs(logs[i]-logs[i+4]);
      if(b[i]===b[i+4])merges++;
    }
  }

  function monoPenalty(values){
    const a=values.filter(v=>v>0).map(Math.log2);
    let inc=0,dec=0;
    for(let i=0;i<a.length-1;i++){
      inc+=Math.max(0,a[i]-a[i+1]);
      dec+=Math.max(0,a[i+1]-a[i]);
    }
    return Math.min(inc,dec);
  }

  let mono=0;
  for(let r=0;r<4;r++)
    mono+=monoPenalty(b.slice(r*4,r*4+4));
  for(let c=0;c<4;c++)
    mono+=monoPenalty([b[c],b[c+4],b[c+8],b[c+12]]);

  for(let rank=0;rank<16;rank++)
    snake+=logs[SNAKE[rank]]*Math.pow(0.72,rank);

  const corner=[0,3,12,15].includes(maxPos)?1:0;

  return empty*w.empty-smooth*w.smooth-mono*w.mono
    +merges*w.merge+Math.log2(max||1)*w.max
    +snake*w.snake+corner*w.corner;
}

function expectimax(b,depth,chance,w,memo){
  if(depth<=0)return evaluate(b,w);

  const key=b.join(",")+"|"+depth+"|"+(chance?1:0);
  if(memo.has(key))return memo.get(key);

  let result;

  if(!chance){
    let best=-Infinity;
    for(let d=0;d<4;d++){
      const m=move(b,d);
      if(!m.changed)continue;
      best=Math.max(best,expectimax(m.board,depth,true,w,memo));
    }
    result=best===-Infinity?evaluate(b,w):best;
  }else{
    const empty=[];
    for(let i=0;i<16;i++)if(!b[i])empty.push(i);

    if(!empty.length){
      result=evaluate(b,w);
    }else{
      let total=0;
      for(const i of empty){
        for(const [value,prob] of [[2,0.9],[4,0.1]]){
          const next=b.slice();
          next[i]=value;
          total+=prob*expectimax(next,depth-1,false,w,memo);
        }
      }
      result=total/empty.length;
    }
  }

  memo.set(key,result);
  return result;
}

function bestMove(b){
  const emptyCount=b.filter(v=>!v).length;
  const depth=emptyCount>9?2:emptyCount>5?3:4;
  const memo=new Map();
  let best=-Infinity,choice=-1;

  for(let d=0;d<4;d++){
    const m=move(b,d);
    if(!m.changed)continue;
    const value=expectimax(m.board,depth,true,weights,memo);
    if(value>best){
      best=value;
      choice=d;
    }
  }
  return choice;
}

function mutate(source){
  const next={...source};
  for(const key of Object.keys(next)){
    next[key]*=Math.exp((Math.random()*2-1)*0.22);
  }
  if(Math.random()<0.12){
    const keys=Object.keys(next);
    const k=keys[Math.floor(Math.random()*keys.length)];
    next[k]*=Math.random()<0.5?0.65:1.5;
  }
  return next;
}

function fitness(){
  const max=Math.max(...board);
  return Math.log2(max||1)*100000
    +Math.log1p(score)*1000+moves*10;
}

function updateStats(){
  const s=data.stats;
  $("stats").textContent=
    `已完成局数：${s.games}\n`+
    `达到 2048：${s.wins} 局\n`+
    `历史最大方块：${s.bestTile}\n`+
    `历史最高分：${s.bestScore}`;
}

function render(){
  $("score").textContent=`得分：${score} · 步数：${moves}`;
  $("max").textContent=`最大方块：${Math.max(...board)}`;

  const grid=$("board");
  grid.innerHTML="";
  const colors={
    0:"#cdc1b4",2:"#eee4da",4:"#ede0c8",
    8:"#f2b179",16:"#f59563",32:"#f67c5f",
    64:"#f65e3b",128:"#edcf72",256:"#edcc61",
    512:"#edc850",1024:"#edc53f",2048:"#edc22e"
  };

  board.forEach(v=>{
    const cell=document.createElement("div");
    cell.className="cell";
    cell.textContent=v||"";
    cell.style.background=colors[v]||"#3c3a32";
    cell.style.color=v>=8?"white":"#776e65";
    if(v>=1024)cell.style.fontSize="clamp(14px,4vw,22px)";
    grid.appendChild(cell);
  });

  updateStats();
}

function stopAuto(){
  auto=false;
  if(timer!==null)clearInterval(timer);
  timer=null;
  $("auto").textContent="自动运行";
}

function finishGame(){
  if(ended)return;
  ended=true;
  stopAuto();

  const max=Math.max(...board);
  const result=fitness();
  const s=data.stats;

  s.games++;
  if(max>=2048)s.wins++;
  s.bestTile=Math.max(s.bestTile,max);
  s.bestScore=Math.max(s.bestScore,score);

  if(result>s.bestFitness){
    s.bestFitness=result;
    data.bestWeights={...weights};
    status("新纪录！本局参数已保存");
  }else{
    status("本局结束，正在探索其他参数");
  }

  saveData();
  render();

  if(continuous){
    generationTimer=setTimeout(()=>{
      generationTimer=null;
      if(continuous)startGame(true);
    },400);
  }else{
    status("游戏结束 · 可重新开始或继续训练");
  }
}

function step(){
  if(ended)return;

  const d=bestMove(board);
  if(d<0){
    finishGame();
    return;
  }

  const m=move(board,d);
  board=m.board;
  score+=m.gain;
  moves++;
  spawn(board);
  render();

  status(`AI选择：${DIRS[d]} · 搜索完成`);

  // 如果已经没有合法移动，立即结束本局。
  if(![0,1,2,3].some(dir=>move(board,dir).changed)){
    finishGame();
  }
}

function startAuto(){
  if(ended)startGame(true);
  if(auto)return;

  auto=true;
  $("auto").textContent="暂停";
  timer=setInterval(step,180);
}

function startGame(learn){
  stopAuto();
  if(generationTimer!==null){
    clearTimeout(generationTimer);
    generationTimer=null;
  }

  ended=false;
  board=newBoard();
  score=0;
  moves=0;

  weights=learn&&data.bestWeights
    ?mutate(data.bestWeights)
    :{...BASE,...(data.bestWeights||{})};

  render();
  status(learn&&data.bestWeights
    ?"已载入历史最佳参数的变异版本"
    :"新的一局");
}

$("step").addEventListener("click",step);

$("auto").addEventListener("click",()=>{
  if(auto)stopAuto();
  else startAuto();
});

$("train").addEventListener("click",()=>{
  continuous=!continuous;
  $("train").textContent=`连续训练：${continuous?"开":"关"}`;

  if(continuous){
    if(ended)startGame(true);
    startAuto();
    status("连续训练中：结束后自动开始下一局");
  }else{
    if(generationTimer!==null){
      clearTimeout(generationTimer);
      generationTimer=null;
    }
    status("连续训练已关闭");
  }
});

$("reset").addEventListener("click",()=>startGame(true));

$("clear").addEventListener("click",()=>{
  if(!confirm("确定清除历史学习数据和统计记录？"))return;

  stopAuto();
  continuous=false;

  if(generationTimer!==null){
    clearTimeout(generationTimer);
    generationTimer=null;
  }

  $("train").textContent="连续训练：关";

  try{localStorage.removeItem(KEY)}catch(e){}

  data=defaultData();
  weights={...BASE};
  startGame(false);
  status("学习数据已清除");
});

// 关闭按钮在独立网页中不能关闭浏览器标签，
// 因此改为停止运行并重置界面。
$("close").addEventListener("click",()=>{
  stopAuto();
  continuous=false;
  $("train").textContent="连续训练：关";
  if(generationTimer!==null){
    clearTimeout(generationTimer);
    generationTimer=null;
  }
  startGame(false);
  status("已停止并重置，可重新开始");
});

document.addEventListener("visibilitychange",()=>{
  // iOS 切换后台时暂停自动运行，避免不必要的计算。
  if(document.hidden&&auto)stopAuto();
});

startGame(false);
console.log("2048 AI 进化版 HTML 已启动");
})();
</script>
</body>
</html>
